{# The letterhead's styles (_letterhead.html), inside the page's <style> #}
    .head { text-align: center; color: {{ lh_color }}; font-family: {{ fonts.mono or 'Courier' }}; font-weight: bold; }
    .split-name { color: {{ lh_color }}; font-family: {{ fonts.mono or 'Courier' }}; font-weight: bold; font-size: 16pt; letter-spacing: 1pt; }
    .head .name { font-size: 20pt; letter-spacing: 1pt; }
    .head .line { font-size: 8pt; line-height: 1.2; }
