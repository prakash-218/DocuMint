{% extends "base.html" %}

{% block title %}Login - Invoice System{% endblock %}

{% block auth_content %}
<div style="max-width: 400px; margin: 100px auto; padding: var(--spacing-xl);">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Login</h2>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('auth_bp.login') }}">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-input" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </div>
            </form>
            <p style="text-align: center; margin-top: var(--spacing-md);">
                Don't have an account? <a href="{{ url_for('auth_bp.register') }}">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
