{% extends "auth/_layout.html" %}

{% block title %}Log in{% endblock %}

{% block auth_form %}
<h1>Welcome back</h1>
<p class="lead">Log in to your DocuMint workspace.</p>

<form method="POST" action="{{ url_for('auth_bp.login') }}">
    <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-input" autocomplete="email" required autofocus>
    </div>
    <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
</form>

<p class="auth-footer">
    New to DocuMint? <a href="{{ url_for('auth_bp.register') }}">Create an account</a><br>
    <span class="text-tertiary">Are you a customer? <a href="{{ url_for('customer_portal_bp.login') }}">Open the customer portal</a></span>
</p>
{% endblock %}
