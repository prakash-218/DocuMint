{% extends "base.html" %}

{% block title %}Register - Invoice System{% endblock %}

{% block auth_content %}
<div style="max-width: 500px; margin: 50px auto; padding: var(--spacing-xl);">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Create Account</h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin-top: 8px;">Step 1 of 2: Enter your email</p>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('auth_bp.register') }}">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-input" required autofocus 
                           placeholder="you@company.com">
                    <small style="color: var(--text-tertiary); font-size: var(--font-size-sm); margin-top: 4px; display: block;">
                        We'll check if an organization with your domain already exists
                    </small>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Continue</button>
                </div>
            </form>
            
            <p style="text-align: center; margin-top: var(--spacing-md);">
                Already have an account? <a href="{{ url_for('auth_bp.login') }}">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
