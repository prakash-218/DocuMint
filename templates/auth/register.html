{% extends "base.html" %}

{% block title %}Register - Invoice System{% endblock %}

{% block auth_content %}
<div style="max-width: 500px; margin: 50px auto; padding: var(--spacing-xl);">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Create Account</h2>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('auth_bp.register') }}">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-input" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required minlength="8">
                    <small style="color: var(--text-tertiary); font-size: var(--font-size-sm);">Must be at least 8 characters</small>
                </div>
                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="org_name" class="form-label">Organization Name</label>
                    <input type="text" id="org_name" name="org_name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="org_domain" class="form-label">Organization Domain</label>
                    <input type="text" id="org_domain" name="org_domain" class="form-input" required placeholder="example.com">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                </div>
            </form>
            <p style="text-align: center; margin-top: var(--spacing-md);">
                Already have an account? <a href="{{ url_for('auth_bp.login') }}">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
