{% extends "base.html" %}

{% block title %}Select Organization{% endblock %}
{% block page_title %}Select Organization{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <p style="margin-bottom: var(--spacing-lg);">Please select an organization to continue:</p>
        
        <form method="POST" action="{{ url_for('settings_bp.select_org') }}">
            <div class="form-group">
                <label for="org_id" class="form-label">Organization *</label>
                <select id="org_id" name="org_id" class="form-select" required>
                    <option value="">Select an organization</option>
                    {% for org in organizations %}
                    <option value="{{ org.org_id }}">{{ org.name }} ({{ org.domain }})</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Select Organization</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
