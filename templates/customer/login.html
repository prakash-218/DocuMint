{% extends "auth/_layout.html" %}

{% block title %}Customer portal{% endblock %}

{% block auth_form %}
<h1>Customer portal</h1>
<p class="lead">View and download the invoices your suppliers have sent you.</p>

<form method="POST" action="{{ url_for('customer_portal_bp.login') }}">
    <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-input" autocomplete="email" required autofocus>
    </div>
    <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
</form>

<p class="auth-footer text-tertiary">
    Don't have a login? Ask the business that invoices you to create one.<br>
    <a href="{{ url_for('auth_bp.login') }}">Staff log in</a>
</p>
{% endblock %}
