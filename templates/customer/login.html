{% extends "customer/base.html" %}

{% block title %}Customer Login - Invoice System{% endblock %}

{% block auth_content %}
<div style="max-width: 400px; margin: 100px auto; padding: var(--spacing-xl);">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Customer Login</h2>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('customer_portal_bp.login') }}">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-input" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
