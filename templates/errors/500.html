{% extends "header.html" %}

{% block title %}Something went wrong{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body text-center" style="padding: var(--spacing-2xl) var(--spacing-xl);">
        <span class="empty-icon" style="margin: 0 auto var(--spacing-md);"><i data-lucide="triangle-alert"></i></span>
        <p class="text-tertiary" style="margin-bottom: var(--spacing-xs);">Error 500</p>
        <h2>Something went wrong</h2>
        <p class="text-secondary">An unexpected error occurred. It's been logged; please try again in a moment.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Go home</a>
    </div>
</div>
{% endblock %}
