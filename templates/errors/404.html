{% extends "header.html" %}

{% block title %}Page not found{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body text-center" style="padding: var(--spacing-2xl) var(--spacing-xl);">
        <span class="empty-icon" style="margin: 0 auto var(--spacing-md);"><i data-lucide="file-question"></i></span>
        <p class="text-tertiary" style="margin-bottom: var(--spacing-xs);">Error 404</p>
        <h2>Page not found</h2>
        <p class="text-secondary">The page you're looking for doesn't exist or you don't have access to it.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Go home</a>
    </div>
</div>
{% endblock %}
