{# Currency, tax and (proforma) advance, for the editor sidebar. Expects doc. #}
{% set v = doc['values'] %}
<div class="form-group">
    <label for="currency" class="form-label">Currency</label>
    <select id="currency" name="currency" class="form-select">
        {% for c in doc['currencies'] %}<option {% if c == doc['currency'] %}selected{% endif %}>{{ c }}</option>{% endfor %}
    </select>
</div>
<div class="form-group">
    <label for="tax_mode" class="form-label">Tax</label>
    <select id="tax_mode" name="tax_mode" class="form-select">
        {% for key, label in doc['tax_modes'].items() %}
        <option value="{{ key }}" {% if v.tax_mode == key %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>
<div class="form-group" id="tax_rate_group">
    <label for="tax_rate" class="form-label">GST rate (%)</label>
    <input type="number" step="0.01" min="0" max="100" id="tax_rate" name="tax_rate" class="form-input"
           value="{{ '%g' | format(v.tax_rate or doc['default_rate']) }}">
    <p class="form-text" id="tax_split_hint"></p>
</div>
{% if doc['type'].key == 'proforma' %}
<div class="form-group">
    <label for="advance_percent" class="form-label">Advance (%)</label>
    <input type="number" step="0.01" min="0" max="100" id="advance_percent" name="advance_percent" class="form-input"
           value="{{ '%g' | format(v.advance_percent) if v.advance_percent else '' }}" placeholder="None">
</div>
<div class="form-group">
    <label for="advance_basis" class="form-label">Advance on</label>
    <select id="advance_basis" name="advance_basis" class="form-select">
        <option value="pre_tax" {% if v.advance_basis != 'total' %}selected{% endif %}>Value before tax</option>
        <option value="total" {% if v.advance_basis == 'total' %}selected{% endif %}>Total with tax</option>
    </select>
</div>
{% endif %}
<script type="application/json" id="tax_hints">{{ doc['customer_hints'] | tojson }}</script>
