{# Customer custom fields, defined under Settings → Business profile. Expects custom_defs, custom_values #}
{% if custom_defs %}
<div class="card-nested" style="margin: var(--spacing-md) 0;">
    <h3 style="margin: 0 0 var(--spacing-sm); font-size: var(--font-size-sm);">More details</h3>
    <div class="form-row">
        {% for f in custom_defs %}
        <div class="form-group">
            <label for="custom_{{ f.key }}" class="form-label">{{ f.label }}{% if f.print %} <span class="text-tertiary">(printed)</span>{% endif %}</label>
            <input type="text" id="custom_{{ f.key }}" name="custom_{{ f.key }}" class="form-input" value="{{ custom_values.get(f.key, '') }}">
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
