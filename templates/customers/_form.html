{# Customer create / edit form. Expects customer (or none), custom_defs, custom_values, action, cancel_url #}
{% set c = customer or {} %}
<form method="POST" action="{{ action }}" class="panel-medium">
    <section class="card">
        <div class="card-body">
            <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name" class="form-input" value="{{ c.name or '' }}" required autofocus>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="tax_id" class="form-label">GSTIN / Tax ID</label>
                    <input type="text" id="tax_id" name="tax_id" class="form-input" value="{{ c.tax_id or '' }}">
                </div>
                <div class="form-group">
                    <label for="email_domains" class="form-label">Email domains</label>
                    <input type="text" id="email_domains" name="email_domains" class="form-input" value="{{ c.email_domains or '' }}" placeholder="wipro.com, givon.com">
                </div>
            </div>
            <div class="form-group">
                <label for="street_address" class="form-label">Address</label>
                <input type="text" id="street_address" name="street_address" class="form-input" value="{{ c.street_address or '' }}">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="city" class="form-label">City</label>
                    <input type="text" id="city" name="city" class="form-input" value="{{ c.city or '' }}">
                </div>
                <div class="form-group">
                    <label for="state" class="form-label">State</label>
                    <input type="text" id="state" name="state" class="form-input" value="{{ c.state or '' }}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="zip_code" class="form-label">PIN / ZIP code</label>
                    <input type="text" id="zip_code" name="zip_code" class="form-input" value="{{ c.zip_code or '' }}">
                </div>
                <div class="form-group">
                    <label for="country" class="form-label">Country</label>
                    <input type="text" id="country" name="country" class="form-input" value="{{ c.country or 'India' }}">
                </div>
            </div>
            {% for f in custom_defs %}
            {% if loop.first %}<div class="form-row">{% endif %}
                <div class="form-group">
                    <label for="custom_{{ f.key }}" class="form-label">{{ f.label }}</label>
                    <input type="text" id="custom_{{ f.key }}" name="custom_{{ f.key }}" class="form-input" value="{{ custom_values.get(f.key, '') }}">
                </div>
            {% if loop.last %}</div>{% endif %}
            {% endfor %}
        </div>
    </section>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ 'Save' if customer else 'Create customer' }}</button>
        <a href="{{ cancel_url }}" class="btn btn-ghost">Cancel</a>
    </div>
</form>
