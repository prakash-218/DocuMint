{% extends "base.html" %}

{% block title %}Edit Customer - Invoice System{% endblock %}
{% block page_title %}Edit Customer{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('customers_bp.edit_customer', customer_id=customer.customer_id) }}">
            <div class="form-group">
                <label for="name" class="form-label">Customer Name *</label>
                <input type="text" id="name" name="name" class="form-input" value="{{ customer.name }}" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="tax_id" class="form-label">Tax ID</label>
                <input type="text" id="tax_id" name="tax_id" class="form-input" value="{{ customer.tax_id or '' }}" placeholder="Optional">
            </div>
            
            <h3 style="margin-top: var(--spacing-xl); margin-bottom: var(--spacing-md); font-size: 1.1rem; color: var(--text-primary);">Address Information</h3>
            
            <div class="form-group">
                <label for="street_address" class="form-label">Street Address</label>
                <input type="text" id="street_address" name="street_address" class="form-input" value="{{ customer.street_address or '' }}" placeholder="123 Main Street">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md);">
                <div class="form-group">
                    <label for="city" class="form-label">City</label>
                    <input type="text" id="city" name="city" class="form-input" value="{{ customer.city or '' }}" placeholder="City">
                </div>
                
                <div class="form-group">
                    <label for="state" class="form-label">State/Province</label>
                    <input type="text" id="state" name="state" class="form-input" value="{{ customer.state or '' }}" placeholder="State">
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md);">
                <div class="form-group">
                    <label for="zip_code" class="form-label">ZIP/Postal Code</label>
                    <input type="text" id="zip_code" name="zip_code" class="form-input" value="{{ customer.zip_code or '' }}" placeholder="12345">
                </div>
                
                <div class="form-group">
                    <label for="country" class="form-label">Country</label>
                    <input type="text" id="country" name="country" class="form-input" value="{{ customer.country or '' }}" placeholder="Country">
                </div>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Update Customer</button>
                <a href="{{ url_for('customers_bp.view_customer', customer_id=customer.customer_id) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
