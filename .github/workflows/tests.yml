# Every push and pull request: the unit tests, and the integration tests against a real PostgreSQL, mail server and S3
# (migrated from scratch and loaded with the demo data, like tests/integration/conftest.py does locally),
# then a check that the migrations and store/schema.py agree.
# With "Wait for CI" on in Railway (each service: Settings > Source), a push to main deploys only
# once this has passed.
name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: documint_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mail:                                 # IMAP / SMTP for the email sync tests
        image: greenmail/standalone:2.0.1
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports: ['3143:3143', '3025:3025']
      s3:                                   # an S3 bucket for the file storage test
        image: adobe/s3mock:3.11.0
        env:
          initialBuckets: documint
        ports: ['9010:9090']
    env:
      DOCUMINT_INTEGRATION_DB: '1'
      DATABASE_URL: postgresql+psycopg://postgres:dev@localhost:5432/documint_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'            # what the Dockerfile runs in production
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Libraries for the PDFs (cairo for xhtml2pdf; DejaVu has the rupee sign)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config fonts-dejavu-core

      - name: Install
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'                # what the Dockerfile builds the frontend with
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend (React screens) - type check, tests, build into static/app for the pages' tests
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run typecheck
          npm test
          npm run build

      - name: Wait for the mail server and S3 (their tests skip themselves when these aren't up)
        run: |
          for port in 3143 3025 9010; do
            timeout 90 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; do sleep 2; done" || { echo "port $port isn't up"; exit 1; }
          done

      - name: Tests
        run: python -m pytest -q -rs

      - name: Migrations match the schema
        run: python -m alembic check
