# Every push and pull request: the unit tests, and the integration tests against a real PostgreSQL
# (migrated from scratch and loaded with the demo data, like tests/integration/conftest.py does locally),
# then a check that the migrations and store/schema.py agree.
# With "Wait for CI" on in Railway (each service: Settings > Source), a push to main deploys only
# once this has passed.
name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: documint_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOCUMINT_INTEGRATION_DB: '1'
      DATABASE_URL: postgresql+psycopg://postgres:dev@localhost:5432/documint_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'            # what the Dockerfile runs in production
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Libraries for the PDFs (cairo for xhtml2pdf; DejaVu has the rupee sign)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config fonts-dejavu-core

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Migrations match the schema
        run: python -m alembic check
